<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Unifood - Campus Hyper-Local Food & Student Jastip Platform</title>
    <meta name="description" content="Unifood: Ekosistem kuliner hyper-local kampus closed-loop. Pesan antar antar-lantai via Jastip Mahasiswa, pre-order kantin bebas antre lift, dan pemberdayaan ekonomi mahasiswa." />
    <meta property="og:title" content="Unifood - Campus Hyper-Local Food & Student Jastip Platform" />
    <meta property="og:description" content="Unifood: Ekosistem kuliner hyper-local kampus closed-loop. Pesan antar antar-lantai via Jastip Mahasiswa, pre-order kantin bebas antre lift, dan pemberdayaan ekonomi mahasiswa." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <meta property="og:image" content="./logo.png" />
    <meta name="twitter:image" content="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900 font-sans">
    <div id="root">
      <!-- Instant Native Preloader (Hilang otomatis begitu React selesai render) -->
      <div id="unifood-initial-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafaf9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; z-index: 9999; gap: 14px;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #059669, #047857); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.35);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="2" x2="6" y2="4"></line>
            <line x1="10" y1="2" x2="10" y2="4"></line>
            <line x1="14" y1="2" x2="14" y2="4"></line>
          </svg>
        </div>
        <div style="text-align: center;">
          <h1 style="font-size: 17px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.02em;">Unifood</h1>
          <p style="font-size: 11px; font-weight: 500; color: #64748b; margin: 3px 0 0 0;">Kantin IBI Kwik Kian Gie</p>
        </div>
        <div style="width: 26px; height: 26px; border: 2.5px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: unifoodSpin 0.75s linear infinite; margin-top: 4px;"></div>
        <style>
          @keyframes unifoodSpin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
